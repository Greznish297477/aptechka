name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # Не проверяем local wrapper — сборка идёт через Gradle из Action
          validate-wrappers: false

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: List APK outputs
        run: find app/build/outputs -name "*.apk" -ls || true

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aptechka-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aptechka-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare APKs for Release
        if: github.event_name == 'release'
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$DEBUG_APK" dist/Aptechka-debug.apk
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" dist/Aptechka-release.apk
          fi
          ls -la dist/

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
