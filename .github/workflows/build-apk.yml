name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == "release" ]]; then
              echo "ERROR: Release APK must be signed with the same keystore as the installed app. Configure the four ANDROID_KEYSTORE_* / ANDROID_KEY_* GitHub Actions secrets."
              exit 1
            fi
            echo "No signing key configured for this non-release build."
          fi

      - name: Set app version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=1.1.7" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: gradle assembleRelease -PappVersionName="$APP_VERSION" --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug -PappVersionName="$APP_VERSION" --stacktrace

      - name: List APK outputs
        run: find app/build/outputs -name "*.apk" -ls || true

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aptechka-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aptechka-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare APKs
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$DEBUG_APK" dist/Aptechka-debug.apk
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" dist/Aptechka-release.apk
          fi
          ls -la dist/

      # Авто-релиз при push тега v1.0.0, v1.0.1, ...
      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: Aptechka ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Если релиз уже создан вручную на сайте
      - name: Attach APKs to existing Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
